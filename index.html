<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRINDAPAN GAMES - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #07040d;
            --card-bg: #110821;
            --card-border: #22123f;
            --accent-pink: #ff0077;
            --accent-purple: #8a2be2;
            --accent-blue: #00d2ff;
            --text-gray: #a39bb8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-dark); color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        .admin-container { width: 100%; max-width: 650px; display: flex; flex-direction: column; gap: 15px; }

        .header-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 15px; display: flex; align-items: center; justify-content: space-between; }
        .header-title { font-family: 'Orbitron', sans-serif; font-size: 1rem; color: var(--accent-pink); font-weight: 800; }

        .admin-nav { display: flex; gap: 6px; background: #0d061a; border-radius: 12px; padding: 5px; border: 1px solid var(--card-border); overflow-x: auto; }
        .admin-nav-btn { flex: 1; min-width: 75px; padding: 10px 0; border: none; background: transparent; color: var(--text-gray); font-size: 0.72rem; font-weight: 700; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: 0.3s; white-space: nowrap; }
        .admin-nav-btn.active { background: linear-gradient(45deg, var(--accent-pink), var(--accent-purple)); color: #fff; }

        .admin-section { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 18px; display: none; flex-direction: column; gap: 12px; }
        .admin-section.active { display: flex; }

        .section-header { font-family: 'Orbitron', sans-serif; font-size: 0.9rem; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }

        input, textarea, button { width: 100%; padding: 12px; background: #0d061a; border: 1px solid var(--card-border); border-radius: 10px; color: #fff; outline: none; font-size: 0.8rem; }
        button.btn-primary { background: linear-gradient(45deg, var(--accent-pink), var(--accent-purple)); font-weight: 700; border: none; cursor: pointer; font-family: 'Orbitron', sans-serif; }
        button.btn-secondary { background: #1a0c33; border: 1px solid var(--accent-purple); color: #fff; font-weight: 600; cursor: pointer; }
        button.btn-blue { background: linear-gradient(45deg, var(--accent-blue), var(--accent-purple)); border: none; font-weight: 700; cursor: pointer; font-family: 'Orbitron', sans-serif; }

        .chat-box-admin { height: 220px; background: #0d061a; border: 1px solid var(--card-border); border-radius: 10px; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .chat-msg { font-size: 0.78rem; background: rgba(255, 255, 255, 0.03); padding: 8px 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .chat-msg-content { display: flex; flex-direction: column; gap: 2px; overflow: hidden; word-break: break-word; }
        .btn-del-chat { background: rgba(255, 0, 85, 0.2); border: 1px solid #ff0055; color: #ff0055; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; flex-shrink: 0; }
        .btn-del-chat:hover { background: #ff0055; color: #fff; }

        .rating-summary-box { background: #0d061a; border-radius: 10px; padding: 12px; border: 1px solid var(--card-border); display: flex; align-items: center; justify-content: space-between; }
        .avg-rating { font-family: 'Orbitron', sans-serif; font-size: 1.6rem; font-weight: 900; color: #ffb700; display: flex; align-items: center; gap: 6px; }

        .feedback-list { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .feedback-item { background: #0d061a; border: 1px solid var(--card-border); border-radius: 8px; padding: 8px 12px; font-size: 0.75rem; }
        .feedback-stars { color: #ffb700; margin-bottom: 2px; }

        .output-box { display: none; background: #0d061a; border: 1px solid var(--accent-purple); border-radius: 10px; padding: 12px; font-size: 0.78rem; gap: 8px; flex-direction: column; margin-top: 5px; }
        .btn-group { display: flex; gap: 6px; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="admin-container">

        <div class="header-box">
            <div class="header-title"><i class="fa-solid fa-user-shield"></i> PRINDAPAN ADMIN</div>
        </div>

        <!-- TAB NAVIGATION -->
        <div class="admin-nav">
            <button class="admin-nav-btn active" onclick="showAdminTab('vaultTab', this)"><i class="fa-solid fa-folder"></i> Vault</button>
            <button class="admin-nav-btn" onclick="showAdminTab('toolsTab', this)"><i class="fa-solid fa-wrench"></i> Tools</button>
            <button class="admin-nav-btn" onclick="showAdminTab('liveChatTab', this)"><i class="fa-solid fa-comments"></i> Live Chat</button>
            <button class="admin-nav-btn" onclick="showAdminTab('infoAdminTab', this)"><i class="fa-solid fa-chart-line"></i> Rating</button>
        </div>

        <!-- TAB 1: VAULT CONTENT MANAGEMENT -->
        <div id="vaultTab" class="admin-section active">
            <div class="section-header"><i class="fa-solid fa-plus-circle" style="color: var(--accent-pink);"></i> TAMBAH LINK BARU</div>
            <input type="text" id="linkTitle" placeholder="Judul File / Game">
            <input type="text" id="linkUrl" placeholder="URL Download Link">
            <input type="text" id="linkImg" placeholder="URL Gambar Thumbnail (Direct Link)">
            <button class="btn-primary" onclick="addLink()"><i class="fa-solid fa-floppy-disk"></i> SIMPAN FILE</button>
        </div>

        <!-- TAB 2: TOOLS UTILITAS -->
        <div id="toolsTab" class="admin-section">
            
            <!-- FITUR 1: KONVERSI GAMBAR KE DIRECT LINK -->
            <div class="section-header"><i class="fa-solid fa-image" style="color: var(--accent-pink);"></i> KONVERSI GAMBAR KE DIRECT LINK</div>
            <input type="file" id="imageInput" accept="image/*">
            <button class="btn-primary" onclick="convertImageToDirectUrl()"><i class="fa-solid fa-bolt"></i> PROSES GAMBAR</button>
            
            <div id="uploadResult" class="output-box">
                <span style="color: var(--accent-blue); font-weight: 700;">Direct Data URL Berhasil Dibuat:</span>
                <textarea id="directUrlResult" rows="3" readonly></textarea>
                <div class="btn-group">
                    <button class="btn-secondary" onclick="copyDirectUrl()"><i class="fa-solid fa-copy"></i> Salin Link</button>
                    <button class="btn-blue" onclick="applyToThumbnail()"><i class="fa-solid fa-arrow-right-to-bracket"></i> Tempel Ke Thumbnail</button>
                </div>
            </div>

            <hr style="border-color: var(--card-border); margin: 8px 0;">

            <!-- FITUR 2: YOUTUBE DATA EXPORTER -->
            <div class="section-header"><i class="fa-brands fa-youtube" style="color: #ff0055;"></i> YOUTUBE DATA EXPORTER</div>
            <input type="text" id="ytUrlInput" placeholder="Tempelkan link video YouTube di sini...">
            <button class="btn-primary" onclick="extractYoutubeData()"><i class="fa-solid fa-magnifying-glass"></i> EKSTRAK DATA VIDEO</button>

            <div id="ytResult" class="output-box">
                <strong style="color: var(--accent-blue);">Judul Video:</strong>
                <input type="text" id="ytTitleResult" readonly>
                
                <strong style="color: var(--accent-blue);">Thumbnail HD Direct URL:</strong>
                <input type="text" id="ytThumbResult" readonly>
                
                <strong style="color: var(--accent-blue);">Deskripsi Video:</strong>
                <textarea id="ytDescResult" rows="2" readonly></textarea>
                
                <button class="btn-blue" onclick="applyYtDataToVault()"><i class="fa-solid fa-arrow-right-to-bracket"></i> Gunakan Data Ini Di Vault</button>
            </div>

        </div>

        <!-- TAB 3: LIVE CHAT VIEWER MONITORING & HAPUS PESAN -->
        <div id="liveChatTab" class="admin-section">
            <div class="section-header"><i class="fa-solid fa-comments" style="color: var(--accent-blue);"></i> MONITOR LIVE CHAT VIEWER</div>
            <div class="chat-box-admin" id="adminChatBox"></div>
            
            <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 5px;">
                <input type="text" id="adminBroadcastInput" placeholder="Ketik pesan broadcast untuk dikirim ke viewer...">
                <button class="btn-primary" onclick="sendAdminBroadcast()"><i class="fa-solid fa-paper-plane"></i> KIRIM POP-UP BROADCAST</button>
            </div>
        </div>

        <!-- TAB 4: INFO & REPUTASI RATING -->
        <div id="infoAdminTab" class="admin-section">
            <div class="section-header"><i class="fa-solid fa-star" style="color: #ffb700;"></i> REPUTASI RATING WEB</div>
            
            <div class="rating-summary-box">
                <div>
                    <div style="font-size: 0.75rem; color: var(--text-gray);">Rata-rata Rating</div>
                    <div class="avg-rating" id="avgRatingValue">0.0 <i class="fa-solid fa-star"></i></div>
                </div>
                <div style="font-size: 0.75rem; color: var(--text-gray);" id="totalReviewsCount">0 Ulasan</div>
            </div>

            <div class="section-header" style="margin-top: 5px;"><i class="fa-solid fa-comment-dots" style="color: var(--accent-blue);"></i> SARAN & KRITIK USER</div>
            <div class="feedback-list" id="feedbackList"></div>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        function showAdminTab(tabId, btn) {
            document.querySelectorAll('.admin-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.admin-nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        const firebaseConfig = {
            apiKey: "AIzaSyDSftuyANybsSrzM7M8mvLJrd8-HhEn1BU",
            authDomain: "prindapan-games.firebaseapp.com",
            databaseURL: "https://prindapan-games-default-rtdb.firebaseio.com",
            projectId: "prindapan-games",
            storageBucket: "prindapan-games.firebasestorage.app",
            messagingSenderId: "280001797119",
            appId: "1:280001797119:web:35a8d16371faf98b4c65ca",
            measurementId: "G-863VM2SE3W"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // SIMPAN LINK DATA KE FIREBASE
        function addLink() {
            const title = document.getElementById('linkTitle').value.trim();
            const url = document.getElementById('linkUrl').value.trim();
            const img = document.getElementById('linkImg').value.trim();

            if (!title || !url) {
                alert('Judul dan URL wajib diisi!');
                return;
            }

            db.ref('links').push({ title, url, img }, (err) => {
                if(!err) {
                    alert('Berhasil menambah link!');
                    document.getElementById('linkTitle').value = '';
                    document.getElementById('linkUrl').value = '';
                    document.getElementById('linkImg').value = '';
                }
            });
        }

        // TOOL 1: KONVERSI GAMBAR KE DIRECT DATA URL (BASE64 TANPA SERVER EXTERNAL)
        function convertImageToDirectUrl() {
            const fileInput = document.getElementById('imageInput');
            
            if (fileInput.files.length === 0) {
                alert('Pilih gambar dari perangkat kamu dulu bre!');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                const directUrl = e.target.result;
                document.getElementById('directUrlResult').value = directUrl;
                document.getElementById('uploadResult').style.display = 'flex';
                alert('Gambar berhasil dikonversi ke Direct Data URL!');
            };

            reader.readAsDataURL(file);
        }

        function copyDirectUrl() {
            const copyText = document.getElementById('directUrlResult');
            copyText.select();
            document.execCommand('copy');
            alert('Direct URL berhasil disalin!');
        }

        function applyToThumbnail() {
            const directUrl = document.getElementById('directUrlResult').value;
            document.getElementById('linkImg').value = directUrl;
            showAdminTab('vaultTab', document.querySelectorAll('.admin-nav-btn')[0]);
            alert('Link thumbnail otomatis tertempel di menu Vault!');
        }

        // TOOL 2: YOUTUBE DATA EXPORTER
        function extractYoutubeData() {
            const inputUrl = document.getElementById('ytUrlInput').value.trim();
            if (!inputUrl) {
                alert('Masukkan link video YouTube dulu!');
                return;
            }

            let videoId = "";
            if (inputUrl.includes("youtu.be/")) {
                videoId = inputUrl.split("youtu.be/")[1].split("?")[0];
            } else if (inputUrl.includes("v=")) {
                videoId = inputUrl.split("v=")[1].split("&")[0];
            }

            if (!videoId) {
                alert('Format link YouTube tidak valid!');
                return;
            }

            const thumbUrl = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
            document.getElementById('ytThumbResult').value = thumbUrl;

            fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('ytTitleResult').value = data.title || "Judul Video YouTube";
                document.getElementById('ytDescResult').value = `Uploader: ${data.author_name || 'YouTube Channel'}`;
                document.getElementById('ytResult').style.display = 'flex';
            })
            .catch(() => {
                document.getElementById('ytTitleResult').value = "Video YouTube (" + videoId + ")";
                document.getElementById('ytDescResult').value = "Link: " + inputUrl;
                document.getElementById('ytResult').style.display = 'flex';
            });
        }

        function applyYtDataToVault() {
            const title = document.getElementById('ytTitleResult').value;
            const thumb = document.getElementById('ytThumbResult').value;
            const url = document.getElementById('ytUrlInput').value;

            document.getElementById('linkTitle').value = title;
            document.getElementById('linkImg').value = thumb;
            document.getElementById('linkUrl').value = url;

            showAdminTab('vaultTab', document.querySelectorAll('.admin-nav-btn')[0]);
            alert('Judul, Thumbnail, dan Link Video berhasil ditempel ke menu Vault!');
        }

        // MONITOR LIVE CHAT VIEWER & FITUR HAPUS PESAN SPESIFIK
        db.ref('chatMessages').limitToLast(50).on('value', (snapshot) => {
            const adminBox = document.getElementById('adminChatBox');
            adminBox.innerHTML = '';
            const messages = snapshot.val();
            if (messages) {
                for (let key in messages) {
                    const msg = messages[key];
                    adminBox.innerHTML += `
                        <div class="chat-msg">
                            <div class="chat-msg-content">
                                <strong style="color: var(--accent-pink);">${escapeHtml(msg.user)}:</strong> 
                                <span>${escapeHtml(msg.text)}</span>
                            </div>
                            <button class="btn-del-chat" onclick="deleteChatMessage('${key}')" title="Hapus Pesan"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                }
                adminBox.scrollTop = adminBox.scrollHeight;
            }
        });

        function deleteChatMessage(messageKey) {
            if (confirm('Yakin ingin menghapus pesan ini dari chat viewer?')) {
                db.ref('chatMessages/' + messageKey).remove((err) => {
                    if (err) {
                        alert('Gagal menghapus pesan!');
                    } else {
                        alert('Pesan berhasil dihapus!');
                    }
                });
            }
        }

        function sendAdminBroadcast() {
            const msg = document.getElementById('adminBroadcastInput').value.trim();
            if (!msg) {
                alert('Ketik pesan broadcast terlebih dahulu!');
                return;
            }

            db.ref('liveBroadcast').set({
                text: msg,
                timestamp: Date.now()
            }, (err) => {
                if (err) {
                    alert('Gagal mengirim pesan!');
                } else {
                    document.getElementById('adminBroadcastInput').value = '';
                    alert('Pesan berhasil terkirim sebagai pop-up broadcast ke viewer!');
                }
            });
        }

        // MONITOR RATING & REPUTATION
        db.ref('ratings').on('value', (snapshot) => {
            const ratings = snapshot.val();
            const list = document.getElementById('feedbackList');
            list.innerHTML = '';

            if(!ratings) {
                document.getElementById('avgRatingValue').innerText = '0.0 ★';
                document.getElementById('totalReviewsCount').innerText = '0 Ulasan';
                return;
            }

            let totalStars = 0;
            let count = 0;

            for (let key in ratings) {
                const item = ratings[key];
                totalStars += item.stars;
                count++;

                let starsHtml = '';
                for(let i=0; i<item.stars; i++) starsHtml += '★';

                list.innerHTML = `
                    <div class="feedback-item">
                        <div class="feedback-stars">${starsHtml}</div>
                        <div>${escapeHtml(item.feedback)}</div>
                    </div>
                ` + list.innerHTML;
            }

            const avg = (totalStars / count).toFixed(1);
            document.getElementById('avgRatingValue').innerHTML = `${avg} <i class="fa-solid fa-star"></i>`;
            document.getElementById('totalReviewsCount').innerText = `${count} Ulasan`;
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
